name: compiled-minicourse
channels:
  - conda-forge
dependencies:
  - python >=3.11,<3.14
  - numpy >=1.24
  - jupyterlab >=4
  - numba >=0.60
  - pybind11 >=3
  - nanobind >=2
  - cython >=3
  - swig >=4.1
  - cppyy >=3.1
  - cffi >=1.16
  - compilers
  - cmake >=3.15
  - ninja
  - pip
  - setuptools >=77
  - scikit-build-core >=0.10
